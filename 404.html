<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Nilay N. Jaltare</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #080b10;
    --surface:#0d1018;
    --border: #1a2235;
    --accent: #00d4aa;
    --text:   #dde4f0;
    --muted:  #4a5568;
    --dim:    #8892a4;
    --mono:   'IBM Plex Mono', monospace;
    --sans:   'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Noise texture — matches portfolio body::before */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.5;
  }

  .wrap {
    position: relative; z-index: 1;
    text-align: center;
    padding: 2rem;
  }

  .code {
    font-family: var(--mono);
    font-size: clamp(5rem, 15vw, 8rem);
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.04em;
    opacity: 0.18;
    margin-bottom: 1.5rem;
    user-select: none;
  }

  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
  }
  .label::before, .label::after {
    content: '';
    display: inline-block;
    width: 24px; height: 1px;
    background: var(--accent);
  }

  h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
    color: var(--text);
  }

  p {
    font-size: 14px;
    color: var(--dim);
    max-width: 360px;
    line-height: 1.7;
    margin: 0 auto 2rem;
  }

  .btn {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.72rem 1.6rem;
    background: var(--accent);
    color: #080b10;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .btn:hover { opacity: 0.82; transform: translateY(-1px); }

  .footer-note {
    margin-top: 3rem;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="label">page not found</div>
    <h1>Nothing here.</h1>
    <p>The page you're looking for doesn't exist or has been moved. Head back to the portfolio.</p>
    <a href="/" class="btn">← Back to portfolio</a>
    <div class="footer-note">nilayjaltare.com · ML · IIoT · Embedded Linux</div>
  </div>
</body>
</html>
